name: ci

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core + dev only — no GPU / no native deps in CI)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: "Tests (Phase 0A gate: synthetic dataset must pass the contract)"
        run: pytest --cov=minegs --cov-report=term-missing
      - name: CLI smoke
        run: |
          minegs --help
          minegs dataset synthetic /tmp/syn --length-m 60 --n-stations 4
          minegs dataset validate /tmp/syn/dataset
          minegs eval protocol /tmp/syn/dataset

  docker-cpu:
    # Only checks that the CPU Dockerfile parses/builds; the GPU image is built and pinned manually (§8.2).
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          ignore: DL3008,DL3013,DL3042
