name: ci

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # report every Python, not just the first to fail
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core + dev + e57 — no GPU, no other native deps in CI)
        run: |
          python -m pip install --upgrade pip
          # The e57 extra is pye57 only (wheels for 3.10-3.12), so the reader is covered by
          # real libE57 round trips in CI. PDAL is a separate extra: its bindings compile
          # against the PDAL C++ library and cannot be pip-installed on a bare runner.
          pip install -e ".[dev,e57]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: "Tests (Phase 0A gate: synthetic dataset must pass the contract)"
        run: pytest --cov=minegs --cov-report=term-missing
      - name: CLI smoke
        run: |
          minegs --help
          minegs dataset synthetic /tmp/syn --length-m 60 --n-stations 4
          minegs dataset validate /tmp/syn/dataset
          minegs eval protocol /tmp/syn/dataset
          # Phase 0D.1 resume safety contract. A resume that quietly becomes fresh training
          # produces a plausible run and a plausible PLY; --ckpt on a training run produces an
          # eval-only pass that also reports success. Both are silent, so the smoke checks the
          # refusals — there is no resume success to check for.
          minegs train run --help | tr -d '\n' | grep -q -- '--resume-from'
          if minegs train command /tmp/syn/dataset --profile light | grep -q -- '--ckpt'; then
            echo "a fresh command carries --ckpt"; exit 1
          fi
          if minegs train run /tmp/syn/dataset --profile light --native \
               --resume-from /tmp/no-such-run; then
            echo "--resume-from accepted a target that does not exist"; exit 1
          fi
          minegs train run /tmp/syn/dataset --profile light --native \
            --resume-from /tmp/no-such-run 2>&1 | tr -d '\n' | tr -s ' ' \
            | grep -q 'does not support resuming training'
          test ! -d /tmp/syn/runs || { echo "a refused resume created a run directory"; exit 1; }
          # A refusal that matches one spelling of a flag is not a refusal: a profile writing the
          # key with its dashes attached used to render as --__ckpt and sail past the guard.
          for key in 'ckpt' '--ckpt' '-ckpt' 'CKPT' 'ckpt '; do
            printf 'schema_version: "1.0"\nname: evil\nbackend: gsplat\nmax_steps: 10\n' > /tmp/evil.yaml
            printf 'backend_args:\n  "%s": /tmp/runs/p/ckpt/ckpt_6999.pt\n' "$key" >> /tmp/evil.yaml
            if minegs train command /tmp/syn/dataset --profile /tmp/evil.yaml > /tmp/evil.out 2>&1; then
              echo "backend_args key '$key' was not refused:"; cat /tmp/evil.out; exit 1
            fi
            grep -q 'evaluation only' /tmp/evil.out || {
              echo "key '$key' was refused for the wrong reason:"; cat /tmp/evil.out; exit 1; }
          done
          echo 'resume contract smoke ok'
          # The whole Phase 0B path against a real (tiny) E57 written here, not a committed
          # fixture: invalid points sit in the middle of the record array so a smoke run
          # catches a colour/coordinate misalignment, which is invisible in the output itself.
          python -c "
          import numpy as np, pye57
          f = pye57.E57('/tmp/smoke.e57', mode='w')
          f.write_scan_raw({
              'cartesianX': np.arange(6, dtype=float), 'cartesianY': np.zeros(6), 'cartesianZ': np.zeros(6),
              'colorRed': np.arange(6, dtype=float), 'colorGreen': np.zeros(6), 'colorBlue': np.zeros(6),
              'cartesianInvalidState': np.array([0, 1, 0, 2, 0, 0], dtype=np.int32),
          }, name='Smoke', translation=np.array([1.0, 2.0, 3.0]))
          f.close()"
          minegs ingest e57 inventory /tmp/smoke.e57 --json /tmp/inventory.json
          python -c "
          import json; d = json.load(open('/tmp/inventory.json'))
          assert d['scan_count'] == 1, d
          assert d['scans'][0]['scan_id'] == 'scan_000'
          assert d['station_candidates'][0]['mapping_status'] == 'inferred_from_scan'
          assert d['scans'][0]['pose']['source_frame'] == 'SOURCE'
          print('e57 inventory smoke ok')"
          minegs ingest e57 pano-map /tmp/smoke.e57 --json /tmp/pano_mapping.json
          python -c "
          import json; d = json.load(open('/tmp/pano_mapping.json'))
          assert d['images'] == [] and d['mappings'] == [], d
          assert 'TLS_GLOBAL' not in json.dumps(d)
          print('e57 pano-map smoke ok')"
          # A mapping file is an input that changes the result, so it has to be in provenance.
          printf 'scan_id,image_id\nscan_000,image_000\n' > /tmp/map.csv
          minegs ingest e57 pano-map /tmp/smoke.e57 --mapping /tmp/map.csv --json /tmp/mapped.json
          python -c "
          import hashlib, json
          d = json.load(open('/tmp/mapped.json'))
          want = hashlib.sha256(open('/tmp/map.csv','rb').read()).hexdigest()
          assert [i['role'] for i in d['mapping_inputs']] == ['explicit_mapping'], d
          assert d['mapping_inputs'][0]['sha256'] == want
          assert want in [a['sha256'] for a in d['provenance']['source_assets']]
          print('mapping provenance smoke ok')"
          minegs ingest e57 extract /tmp/smoke.e57 /tmp/e57_staging
          python -c "
          import json, pathlib
          from minegs.core.pointcloud import read_ply
          m = json.load(open('/tmp/e57_staging/extraction_manifest.json'))
          s = m['scan_outputs'][0]
          assert m['registration'] == 'registered' and m['output_frame'] == 'SOURCE', m
          assert 'TLS_GLOBAL' not in json.dumps(m) and 'LOCAL_METRIC' not in json.dumps(m)
          assert s['invalid_points_removed'] == 2 and s['point_count_output'] == 4, s
          assert s['sha256'] and m['source_sha256']
          pc = read_ply(s['path'])
          assert pc.frame == 'SOURCE'
          assert pc.xyz[:, 0].tolist() == [1.0, 3.0, 5.0, 6.0], pc.xyz
          assert pc.rgb[:, 0].tolist() == [0, 2, 4, 5], 'colour must follow the surviving points'
          root = pathlib.Path('/tmp/e57_staging')
          assert not (root / 'manifest.json').exists(), 'staging must not look like dataset/'
          # one digest, shared: an artifact that cannot name the bytes it read cannot say
          # what its own scan_000 refers to
          inv = json.load(open(root / 'inventory.json'))
          rep = json.load(open(root / 'pano_mapping.json'))
          assert inv['file']['sha256'] == rep['source_sha256'] == m['source_sha256'], 'digests differ'
          assert inv['file']['hash_skipped_reason'] is None
          print('e57 extract smoke ok')"
          # a second run must refuse rather than mix, and must not touch what it did not write
          echo 'field notes' > /tmp/e57_staging/notes.md
          if minegs ingest e57 extract /tmp/smoke.e57 /tmp/e57_staging --overwrite; then
            echo "extract overwrote a directory holding a foreign file"; exit 1
          fi
          test -f /tmp/e57_staging/notes.md
          rm /tmp/e57_staging/notes.md
          if minegs ingest e57 extract /tmp/smoke.e57 /tmp/e57_staging; then
            echo "extract mixed two runs in one directory"; exit 1
          fi
          minegs ingest e57 extract /tmp/smoke.e57 /tmp/e57_staging --overwrite
          test -z "$(find /tmp -maxdepth 1 -name '.e57_staging.minegs-*' -print -quit)" \
            || { echo "a staging temp directory was left behind"; exit 1; }
          echo 'e57 staging safety smoke ok'
          # Phase 0C G1: synthetic staging -> calibrated axis convention -> dataset -> Golden Gate.
          # The convention is measured, not assumed; the report never claims real-data validation.
          minegs dataset synthetic-staging /tmp/stg --length-m 45 --station-spacing-m 15 --image-size 48
          minegs dataset calibrate-camera /tmp/stg/staging --out /tmp/stg/camera_convention.json
          python -c "
          import json; c = json.load(open('/tmp/stg/camera_convention.json'))
          assert c['status'] == 'selected' and c['convention']['label'] == 'cam(+X,-Y,-Z)', c['status']
          assert len(c['sampled_station_ids']) == 3, c['sampled_station_ids']
          print('calibration smoke ok')"
          printf 'schema_version: \"1.0\"\ndataset_id: ci_0c\nsource_frame: {mode: explicit_identity}\n' > /tmp/stg/build.yaml
          printf 'camera: {mode: e57_pinhole, convention_file: /tmp/stg/camera_convention.json}\n' >> /tmp/stg/build.yaml
          printf 'initialization: {voxel_m: 0.1, max_points: 20000, sparse_max_points: 2000}\n' >> /tmp/stg/build.yaml
          minegs dataset from-e57 /tmp/stg/staging /tmp/stg/dataset --config /tmp/stg/build.yaml
          minegs dataset validate /tmp/stg/dataset --strict
          minegs eval protocol /tmp/stg/dataset
          minegs dataset golden-gate /tmp/stg/dataset --staging /tmp/stg/staging --out /tmp/stg/gg
          python -c "
          import json; r = json.load(open('/tmp/stg/gg/report.json'))
          assert r['structural_result'] == 'pass', r['structural_problems']
          assert r['real_data_validation_status'] == 'pending_human_inspection'
          assert r['overlays'] and r['init_points_in_holdout'] in (None, 0)
          m = json.load(open('/tmp/stg/dataset/manifest.json'))
          assert m['coordinate_frames']['T_tls_from_local'][0][:3] == [1.0, 0.0, 0.0], 'LOCAL_METRIC is translation-only'
          print('phase 0c golden gate smoke ok')"
          # a build that never declared SOURCE -> TLS_GLOBAL must not happen
          printf 'schema_version: \"1.0\"\ndataset_id: x\ncamera: {mode: e57_pinhole, convention_file: /tmp/stg/camera_convention.json}\n' > /tmp/stg/bad.yaml
          if minegs dataset from-e57 /tmp/stg/staging /tmp/stg/bad --config /tmp/stg/bad.yaml; then
            echo "a dataset was built without a SOURCE frame declaration"; exit 1
          fi
          test ! -d /tmp/stg/bad
          echo 'phase 0c fail-closed smoke ok'
          # Phase 3: the image/360 path as far as a runner without COLMAP or ffmpeg can go.
          # The frame set is real — real selection, real ring crops, real masks, real digests —
          # and everything past it is checked for refusing rather than degrading.
          mkdir -p /tmp/p3/frames
          python -c "
          import numpy as np
          from PIL import Image
          rng = np.random.default_rng(0)
          for i in range(4):
              a = np.sin(np.linspace(0, 8, 64))[None, :, None] * 60 + rng.integers(0, 160, (32, 64, 3))
              Image.fromarray(a.clip(0, 255).astype('uint8')).save(f'/tmp/p3/frames/v_{i:06d}.png')"
          minegs ingest video frameset /tmp/p3/frames /tmp/p3/fs --kind video360 \
            --n-yaw 4 --fov-deg 90 --size 32 --pano-source Configured --nadir-el-deg -30 \
            --blur 0.0 --hamming 0
          python -c "
          from pathlib import Path
          from minegs.ingest.video.models import check_frameset, load_frameset
          rec, root = load_frameset('/tmp/p3/fs')
          assert rec.kind == 'video360' and rec.pano_convention.source == 'Configured'
          assert rec.extraction.method == 'none' and rec.extraction.real_execution is True
          assert len(rec.images) == 16 and len(rec.crops) == 16 and len(rec.masks) == 16
          stems = [Path(i.name).stem for i in rec.images]
          assert len(set(stems)) == 16, 'two crops of one panorama want one depth map name'
          check_frameset(rec, root)
          print('phase 3 frame set smoke ok')"
          # a 360 frame set must not borrow the scanner's panorama convention, or run without one
          if minegs ingest video frameset /tmp/p3/frames /tmp/p3/fs2 --kind video360 --n-yaw 4; then
            echo 'a 360 frame set was built with no declared panorama convention'; exit 1
          fi
          if minegs ingest video frameset /tmp/p3/frames /tmp/p3/fs3 --kind video360 --n-yaw 4 \
               --pano-source E57Embedded; then
            echo "a camera's frame set adopted the scanner's panorama convention"; exit 1
          fi
          # SfM is given the directory, not the list, so a file put there afterwards is refused
          cp "$(find /tmp/p3/fs/images/p0y00 -name '*.png' | head -1)" \
            /tmp/p3/fs/images/p0y00/smuggled.png
          python -c "
          from minegs.core.errors import ContractError
          from minegs.ingest.video.models import check_frameset, load_frameset
          try:
              check_frameset(*load_frameset('/tmp/p3/fs'))
          except ContractError as e:
              assert 'not in the record' in str(e), e
              print('phase 3 stowaway smoke ok')
          else:
              raise SystemExit('an image nobody recorded reached the SfM input set')"
          rm /tmp/p3/fs/images/p0y00/smuggled.png
          # no COLMAP here: the refusal must be about COLMAP, and must leave nothing behind
          if minegs ingest video sfm /tmp/p3/fs /tmp/p3/sfm > /tmp/p3/sfm.out 2>&1; then
            echo 'SfM reported success without COLMAP'; cat /tmp/p3/sfm.out; exit 1
          fi
          grep -q 'colmap' /tmp/p3/sfm.out || { echo 'wrong reason:'; cat /tmp/p3/sfm.out; exit 1; }
          test ! -e /tmp/p3/sfm || { echo 'a reconstruction that never ran left a directory'; exit 1; }
          # registration is a measurement: without correspondences there is nothing to measure
          if minegs eval register /tmp/p3/fs /tmp/p3/reg --basis known_target; then
            echo 'registration ran with no correspondences'; exit 1
          fi
          # each golden gate refuses the dataset it has no evidence for
          if minegs dataset golden-gate /tmp/stg/dataset --out /tmp/p3/gg; then
            echo 'a TLS dataset got a gate without its station scans'; exit 1
          fi
          # and a comparison is between two reconstructions, not one against itself
          if minegs eval compare-paths /tmp/stg/dataset /tmp/stg/dataset \
               --tls-sections /tmp/p3/x.json --tls-reference-sections /tmp/p3/x.json \
               --image-sections /tmp/p3/x.json --image-reference-sections /tmp/p3/x.json; then
            echo 'a dataset was compared against itself'; exit 1
          fi
          echo 'phase 3 fail-closed smoke ok'

  dockerfiles:
    # Lint both images explicitly (their names are Dockerfile.cpu / Dockerfile.gpu, which the
    # action's recursive **/Dockerfile glob does not match). The GPU image is built and pinned
    # by digest manually (§8.2); CI only lints.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint docker/Dockerfile.gpu
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.gpu
          failure-threshold: warning
          ignore: DL3008,DL3013,DL3042
      - name: hadolint docker/Dockerfile.cpu
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.cpu
          failure-threshold: warning
          ignore: DL3008,DL3013,DL3042
