schema_version: "1.0"
name: light
description: >-
  Quick local baseline — ≤100 images (subset written by minegs.train.staging), quarter
  resolution, 7k iters (§8.3). The Phase 0D baseline profile.
backend: gsplat
default_runner: local
max_images: 100
data_factor: 4
max_steps: 7000
requests:                       # capability -> required? (true = refuse backend without it)
  depth_loss: false
  appearance_embedding: false
  bilateral_grid: false
  antialiasing: false
backend_args:
  strategy: default
  normalize_world_space: false  # BACKEND_INTERNAL == LOCAL_METRIC (§3); true is refused
  init_type: sfm                # staging writes init_points.ply into sparse/0 as points3D
  sh_degree: 3
  eval_steps: [7000]
  save_steps: [7000]
  save_ply: true
