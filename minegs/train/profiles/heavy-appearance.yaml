schema_version: "1.0"
name: heavy-appearance
description: >-
  Phase 4 ablation: heavy with appearance embedding only. Identical to `heavy`
  in every other setting, so heavy-base, heavy-appearance, heavy-depth and heavy separate the
  two effects. Structurally tested only; no real GPU run performed.
backend: gsplat
default_runner: local              # RunPod is Phase 6 and not implemented
max_images: null                   # every train image (the dataset's holdout is never staged)
data_factor: 2
max_steps: 30000
requests:
  depth_loss: false
  appearance_embedding: true
  bilateral_grid: false            # not together with appearance (AD-6)
  antialiasing: false              # the depth renderer reproduces classic mode only (AD-6)
backend_args:
  strategy: mcmc                   # noise_lr / scale_reg rescaled to metres by the adapter
  normalize_world_space: false
  init_type: sfm
  sh_degree: 3
  test_every: 1000000              # upstream val = one image, not every 8th (C0 §2.3-3)
  eval_steps: [7000, 15000, 30000]
  save_steps: [15000, 30000]
  save_ply: true
